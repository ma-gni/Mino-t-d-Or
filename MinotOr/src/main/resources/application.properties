# Configuration de la base de données
spring.datasource.url=jdbc:postgresql://localhost:5433/minotor_db
spring.datasource.username=postgres
spring.datasource.password=0000
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration JPA
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuration JWT - CORRECTION CRITIQUE
jwt.secret=${JWT_SECRET:MinotOr2024SecureKey256BitsForProductionUseOnly}
jwt.expiration-minutes=60

# Configuration CORS - AMÉLIORATION
cors.allowed-origins=http://localhost:3000,http://localhost:5173,https://minotor.fr
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# Configuration de l'application
server.port=8080
logging.level.com.magnii.minotor=INFO