# Configuration de la base de données - MySQL (XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/minotor_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuration JPA
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Configuration JWT
jwt.secret=${JWT_SECRET:MinotOr2024SecureKey256BitsForProductionUseOnly}
jwt.expiration-minutes=60

# Configuration CORS
cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:5177,https://minotor.fr,http://192.168.99.223:8081
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# Configuration de l'application
server.port=8081
logging.level.com.magnii.minotor=INFO