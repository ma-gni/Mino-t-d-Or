services:
  db:
    image: postgres:15
    container_name: minotor-db     # only once
    environment:
      POSTGRES_DB: minotor_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 0000
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d minotor_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    container_name: minotor-app    # only once
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # DB talks to service name "db"
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/minotor_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 0000

      # ✅ TokenService props (correct names)
      SECURITY_TOKEN_SERVER_SECRET: "my-super-strong-secret"
      SECURITY_TOKEN_SERVER_INTEGER: "16"

      # Other app settings
      JWT_SECRET: "another-secret"
      JWT_EXPIRATION_MINUTES: "60"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,https://your-frontend.com"
    ports:
      - "8080:8080"